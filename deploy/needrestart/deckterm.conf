# Install as /etc/needrestart/conf.d/deckterm.conf (root-owned, mode 0644).
#
# Ubuntu's needrestart runs after every apt upgrade. In automatic mode
# ($nrconf{restart} = 'a') it restarts every service whose processes map an
# upgraded library. The DeckTerm unit hosts the tmux server and every user
# shell inside it, so an unattended libc/libtinfo/libevent upgrade would
# restart the unit and end every session. Never auto-restart it — deploys
# restart it on purpose, and KillMode=process keeps tmux alive when they do.
#
# The pattern also covers a dev unit and an optional external tmux unit.
$nrconf{override_rc}{qr(^deckterm(-dev|-tmux)?\.service$)} = 0;
