# DeckTerm reads this file as data with Bun.TOML.parse (backend/agent-screen-rules.ts).
# Never fetched or updated automatically: re-sync by hand at every Claude
# upgrade (docs/plans/2026-10-22-agent-attention-design.md section 8), then run
# backend/agent-screen-rules.test.ts and backend/agent-screen-fixtures.test.ts.
#
# DeckTerm edits (everything else is byte-for-byte upstream):
#   1. This header comment.
#   2. Added rule "deckterm_blocked_form_wrapped" right after live_blocked_form.
#      At phone width (44 columns) Claude 2.1.308 wraps the form footer as
#      "Enter to select · ↑/↓ to navigate · Esc to" / "cancel", so
#      live_blocked_form's contains("esc to cancel") misses it and the screen
#      read as idle (live_prompt_box). Same footer words, any whitespace
#      (including the wrap) between them; same priority, so live_blocked_form
#      still wins whenever it matches. Fixture:
#      backend/fixtures/agent-screens/claude-2.1.308-blocked-question-form-phone.txt
#   3. Linear-time rewrites. herdr matches with the Rust regex crate (linear
#      time); JavaScript backtracks, and these upstream fragments backtracked
#      super-linearly on adversarial pane text. Each rewrite matches exactly
#      the same strings (backend/agent-screen-perf.test.ts compares them with
#      the upstream text on generated input). Re-apply after every re-sync:
#      - background_mcp_task_working: `(?:\n[ \t]+[^\n]*?){0,3}` became
#        `(?:\n[ \t][^\n]*?){0,3}` (the indent could be split between the
#        two quantifiers in many ways on each of the three lines).
#      - live_blocked_form_named_session: `─{3,}[^\n]*` became `─{3}[^\n]*`,
#        and the task rows `[◻◼✔][ \t]+[^\n]+` became `[◻◼✔][ \t][^\n]+`
#        (exponential in the number of rows).
#      - mcp_elicitation_prompt, bash_permission_prompt and
#        generic_permission_prompt: `\s*❯?\s*` (also written `\x{276F}?`)
#        became `\s*(?:❯\s*)?` (quadratic in leading whitespace).
#      - legacy_no_prompt_blocker: `(?m)^\s*❯\s*$` became
#        `(?m)^[^\S\n]*❯[^\S\n]*$` (`\s` crossed line breaks, so every line
#        start re-scanned all following blank lines).

id = "claude"
version = "2026.10.11.1"
min_engine_version = 2
updated_at = "2026-10-11T00:00:00Z"
aliases = ["claude-code"]

[[rules]]
id = "osc_title_working"
state = "working"
priority = 1100
region = "osc_title"
visible_working = true
# Braille covers <= 2.1.227; half-circles are the 2.1.228 busy spinner.
regex = ['^[\x{2800}-\x{28FF}\x{25D0}-\x{25D3}] ']

[[rules]]
id = "live_turn_working"
state = "working"
priority = 970
region = "bottom_non_empty_lines(12)"
visible_working = true
any = [
  { line_regex = ['^\s*[⏸⏵].*esc to interrupt(?:\s|·|$)'] },
  { line_regex = ['^\s*[\x{002A}\x{00B7}\x{2722}\x{2733}\x{2736}\x{273B}\x{273D}]\s+\S.*…(?:\s+\(\d+[smh](?:\s|·)|\s*$)'] },
]

[[rules]]
id = "background_agents_working"
state = "working"
priority = 965
region = "last_non_empty_above_prompt_box"
visible_working = true
line_regex = ['^\s*[\x{002A}\x{00B7}\x{2722}\x{2736}\x{273B}\x{273D}]\s+Waiting for [1-9]\d* background agents? to finish\s*$']

[[rules]]
id = "background_mcp_task_working"
state = "working"
priority = 965
region = "bottom_non_empty_lines(12)"
visible_working = true
# Claude renders activity summaries at column zero; wrapped continuations are indented.
# Keeping that shape prevents user prompt text from impersonating this signal.
regex = ['(?m)^[\x{002A}\x{00B7}\x{2722}\x{2736}\x{273B}\x{273D}][ \t]+\S[^\n]*?(?:\n[ \t][^\n]*?){0,3}·(?:[ \t]+|\n[ \t]*)[1-9]\d*(?:[ \t]+|\n[ \t]*)MCP(?:[ \t]+|\n[ \t]*)tasks?(?:[ \t]+|\n[ \t]*)still(?:[ \t]+|\n[ \t]*)running[ \t]*$']
not = [
  { contains = ["do you want to proceed?"] },
  { contains = ["esc to cancel"] },
  { contains = ["waiting for permission"] },
  { contains = ["do you want to allow this connection?"] },
  { contains = ["tab to amend"] },
  { contains = ["ctrl+e to explain"] },
]

[[rules]]
id = "btw_overlay_working"
state = "working"
priority = 975
region = "bottom_non_empty_lines(5)"
visible_working = true
line_regex = [
  '^\s*/btw(?:\s|$)',
  '(?i)esc to close\s*$',
]

[[rules]]
id = "transcript_viewer"
state = "unknown"
priority = 1000
region = "bottom_non_empty_lines(3)"
skip_state_update = true
contains = ["showing detailed transcript"]
any = [
  { contains = ["ctrl+o", "to toggle"] },
  { contains = ["ctrl+e", "show all"] },
  { contains = ["ctrl+e", "collapse"] },
  { contains = ["↑↓ scroll"] },
  { contains = ["? for shortcuts"] },
]

[[rules]]
id = "live_blocked_form"
state = "blocked"
priority = 980
region = "after_last_horizontal_rule"
visible_blocker = true
contains = ["esc to cancel"]
any = [
  { contains = ["enter to confirm"] },
  { contains = ["enter to select"], any = [
    { contains = ["tab/arrow keys to navigate"] },
    { contains = ["arrow keys to navigate"] },
    { contains = ["arrows to navigate"] },
    { contains = ["↑/↓ to navigate"] },
    { contains = ["↑↓ to navigate"] },
  ] },
]

[[rules]]
# DeckTerm addition (see the header): wrap-tolerant live_blocked_form.
id = "deckterm_blocked_form_wrapped"
state = "blocked"
priority = 980
region = "after_last_horizontal_rule"
visible_blocker = true
regex = ['(?i)esc\s+to\s+cancel']
any = [
  { regex = ['(?i)enter\s+to\s+confirm'] },
  { regex = ['(?i)enter\s+to\s+select'], any = [
    { regex = ['(?i)(?:tab/arrow\s+keys|arrow\s+keys|arrows|↑/↓|↑↓)\s+to\s+navigate'] },
  ] },
]

[[rules]]
id = "live_blocked_form_named_session"
state = "blocked"
priority = 980
region = "whole_recent"
visible_blocker = true

# Bind every control to the same footer, allowing wrapping between words.
# After the name divider, accept only a counted task panel with marked rows
# and optional pending overflow. Free-form activity can be newer output (#4573).
regex = ['(?i)(?:^|\n)[ \t]*enter\s+to\s+(?:confirm|select\s+·\s+(?:(?:tab/arrow|arrow)\s+keys|arrows|↑/↓|↑↓)\s+to\s+navigate)\s+·\s+esc\s+to\s+cancel[ \t]*\n(?:[ \t]*\n)*[ \t]*─{3}[^\n]*(?:\n(?:[ \t]*\n)*[ \t]+\d+ tasks? \(\d+ done, (?:\d+ in progress, )?\d+ open\)(?:\n[ \t]+[◻◼✔][ \t][^\n]+)+(?:\n[ \t]+…[ \t]+\+\d+[ \t]+pending)?)?(?:\n[ \t]*)*\z']

[[rules]]
id = "dynamic_workflow_prompt"
state = "blocked"
priority = 980
region = "whole_recent"
visible_blocker = true
contains = ["run a dynamic workflow?", "esc to cancel"]

[[rules]]
id = "mcp_elicitation_prompt"
state = "blocked"
priority = 980
region = "whole_recent"
visible_blocker = true
# MCP elicitation dialogs (elicitation/create) show Accept/Decline controls
# with an "Esc to cancel" footer but no Enter hint, so live_blocked_form
# cannot see them (issue #3283). Gate on the invariant header line, the
# Accept/Decline control line, and the cancel footer.
contains = ["esc to cancel"]
line_regex = ['(?i)^\s*MCP server ["\x{201C}].+["\x{201D}] requests your input\s*$']
all = [
  { any = [
    { line_regex = ['^\s*(?:\x{276F}\s*)?Accept\b'] },
    { line_regex = ['^\s*(?:\x{276F}\s*)?Decline\b'] },
  ] },
]

[[rules]]
id = "live_prompt_box"
state = "idle"
priority = 950
region = "prompt_box_body"
visible_idle = true
line_regex = ['^\s*❯']
not = [
  { contains = ["enter to select"] },
  { contains = ["esc to cancel"] },
  { contains = ["tab/arrow keys"] },
  { contains = ["arrow keys to navigate"] },
  { contains = ["↑/↓ to navigate"] },
]

[[rules]]
id = "model_picker_menu"
state = "unknown"
priority = 900
region = "whole_recent"
skip_state_update = true
contains = ["select model", "enter to set as default", "esc to cancel"]
not = [
  { contains = ["do you want to proceed?"] },
  { contains = ["enter to select"] },
]

[[rules]]
id = "bash_permission_prompt"
state = "blocked"
priority = 850
region = "whole_recent"
visible_blocker = true
contains = ["do you want to proceed?"]
any = [
  { contains = ["bash command"] },
  { contains = ["bash("] },
  { contains = ["contains expansion"] },
  { contains = ["tab to amend"] },
  { contains = ["ctrl+e to explain"] },
]
# Claude marks the selected option with "❯", so every option branch has to allow
# that prefix. Numbered branches that omit it only match options the cursor has
# moved away from, which left the resting layout below unmatched here (#2650):
#   ❯ 1. Yes / 2. Yes, and don't ask again for: <cmd> / 3. No
# Cover both the two-option and "don't ask again" three-option shapes so this
# rule, not the narrower generic_permission_prompt, claims Bash approvals.
all = [
  { any = [
    { line_regex = ['(?i)^\s*(?:❯\s*)?yes\b'] },
    { line_regex = ['(?i)^\s*(?:❯\s*)?1\.\s*yes\b'] },
    { line_regex = ['(?i)^\s*(?:❯\s*)?2\.\s*yes\b'] },
    { line_regex = ['(?i)^\s*(?:❯\s*)?2\.\s*no\b'] },
    { line_regex = ['(?i)^\s*(?:❯\s*)?3\.\s*no\b'] },
  ] },
]

[[rules]]
id = "generic_permission_prompt"
state = "blocked"
priority = 840
region = "after_last_horizontal_rule"
visible_blocker = true
contains = ["do you want to proceed?", "esc to cancel"]
all = [
  { any = [
    { line_regex = ['(?i)^\s*(?:❯\s*)?1\.\s*yes\b'] },
    { line_regex = ['(?i)^\s*2\.\s*yes\b'] },
    { line_regex = ['(?i)^\s*2\.\s*no\b'] },
    { line_regex = ['(?i)^\s*3\.\s*no\b'] },
  ] },
]

[[rules]]
id = "legacy_no_prompt_blocker"
state = "blocked"
priority = 300
region = "whole_recent"
any = [
  { contains = ["do you want to"], any = [{ contains = ["yes"] }, { contains = ["❯"] }] },
  { contains = ["would you like to"], any = [{ contains = ["yes"] }, { contains = ["❯"] }] },
  { contains = ["waiting for permission"] },
  { contains = ["do you want to allow this connection?"] },
  { contains = ["tab to amend"] },
  { contains = ["ctrl+e to explain"] },
  { contains = ["do you want to proceed?", "esc to cancel"] },
  { contains = ["review your answers"] },
  { contains = ["skip interview and plan immediately"] },
]
not = [
  { regex = ['(?m)^[^\S\n]*❯[^\S\n]*$'] },
]

[[rules]]
id = "osc_title_idle"
state = "idle"
priority = 250
region = "osc_title"
visible_idle = true
regex = ['^\x{2733} ']

[[rules]]
id = "osc_progress_idle"
state = "idle"
priority = 250
region = "osc_progress"
regex = ['^4;0']
